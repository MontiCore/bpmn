pluginManagement {
    repositories {
        mavenCentral()
        if(("true").equals(getProperty('useLocalRepo'))){
            mavenLocal()
        }
        maven {
            credentials.username = mavenUser
            credentials.password = mavenPassword
            url = repo
        }

        gradlePluginPortal()
    }
}

rootProject.name="BPMN"
include(':WorkflowCLI')
include(':WorkflowDSL')
include(':WorkflowConformance')
include(':WorkflowEngine')


